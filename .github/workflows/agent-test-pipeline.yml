name: Agent-Driven Test Pipeline

# ── Triggers ──────────────────────────────────────────────────────────────────
# 1. CI/CD Trigger  – fires on every PR (Test Orchestrator Agent)
# 2. Manual Trigger – workflow_dispatch with explicit service list
# 3. Nightly        – full regression at 03:00 UTC
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated list of services to test (leave blank for all)"
        required: false
        default: "claims-api pricing policy"
      trigger_type:
        description: "Trigger type"
        required: false
        default: "manual"
        type: choice
        options: [manual, docs]
  schedule:
    - cron: "0 3 * * *"    # 03:00 UTC – nightly regression

permissions:
  contents: write
  pull-requests: read
  issues: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION:   "20"

jobs:
  # ── 0. Orchestrator: initialise session & detect scope ────────────────────
  orchestrate:
    name: "🤖 Orchestrator – Init Session"
    runs-on: ubuntu-latest
    outputs:
      session_id:    ${{ steps.session.outputs.session_id }}
      services_json: ${{ steps.scope.outputs.services_json }}
      trigger_type:  ${{ steps.scope.outputs.trigger_type }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Detect trigger type and services in scope
      - name: Determine scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TRIGGER="nightly"
            SERVICES="claims-api pricing policy"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TRIGGER="pr"
            # Use the existing changed-services detector and parse its matrix JSON output
            MATRIX_LINE=$(python tools/ci/changed_services.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" 2>/dev/null | grep '^matrix=' || true)
            if [ -n "$MATRIX_LINE" ]; then
              SERVICES=$(python3 -c "
          import json, sys
          line = '$MATRIX_LINE'
          data = json.loads(line.split('=',1)[1])
          svcs = [e['service'] for e in data.get('include',[]) if e['service'] != '__none__']
          print(' '.join(svcs) if svcs else 'claims-api pricing policy')
          " 2>/dev/null || echo "claims-api pricing policy")
            else
              SERVICES="claims-api pricing policy"
            fi
          else
            TRIGGER="${{ inputs.trigger_type }}"
            SERVICES="${{ inputs.services }}"
          fi
          echo "trigger_type=$TRIGGER" >> "$GITHUB_OUTPUT"
          # Convert space-separated list to JSON array for matrix
          SERVICES_JSON=$(python3 -c "
          import json, sys
          svcs = '$SERVICES'.split()
          print(json.dumps(svcs))
          ")
          echo "services_json=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          echo "Trigger: $TRIGGER  |  Services: $SERVICES"

      # Initialise the shared session state (Test Orchestrator Agent logic)
      - name: Init session state
        id: session
        run: |
          SERVICES_FLAT=$(echo '${{ steps.scope.outputs.services_json }}' \
            | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)))")
          SESSION_ID=$(python tools/agents/session_state.py new \
            --trigger "${{ steps.scope.outputs.trigger_type }}" \
            --services $SERVICES_FLAT \
            --pr   "${{ github.event.pull_request.number }}" \
            --sha  "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-id "${{ github.run_id }}")
          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
          echo "Session ID: $SESSION_ID"

      - name: Upload initial session state
        uses: actions/upload-artifact@v4
        with:
          name: session-state-init
          path: agent-sessions.json
          retention-days: 7

  # ── 1. Test Design Agent – generate / review test coverage ───────────────
  test-design:
    name: "🎨 Test Design – Coverage Review"
    runs-on: ubuntu-latest
    needs: orchestrate

    steps:
      - uses: actions/checkout@v4

      - name: Download session state
        uses: actions/download-artifact@v4
        with:
          name: session-state-init

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The Test Design Agent inspects coverage and flags gaps.
      # In CI, this step checks that coverage config and test files exist.
      - name: Verify test files exist for each in-scope service
        id: design-check
        run: |
          SESSION_ID="${{ needs.orchestrate.outputs.session_id }}"
          SERVICES=$(echo '${{ needs.orchestrate.outputs.services_json }}' \
            | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)))")
          GAPS=""
          for SVC in $SERVICES; do
            if [ ! -d "services/$SVC/tests" ]; then
              GAPS="$GAPS $SVC"
              echo "⚠️  No tests/ directory for service: $SVC"
            else
              echo "✅ tests/ directory found for service: $SVC"
            fi
          done
          python tools/agents/session_state.py write \
            --session "$SESSION_ID" \
            --key test_design \
            --data "{\"services_checked\":\"$SERVICES\",\"gaps\":\"$GAPS\"}"

      - name: Upload session state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-state-design
          path: agent-sessions.json
          retention-days: 7

  # ── 2a. Test Execution Agent – claims-api (Playwright) ───────────────────
  execute-claims-api:
    name: "▶️ Execute – claims-api (Playwright)"
    runs-on: ubuntu-latest
    needs: [orchestrate, test-design]
    if: contains(fromJson(needs.orchestrate.outputs.services_json), 'claims-api')

    steps:
      - uses: actions/checkout@v4

      - name: Download session state
        uses: actions/download-artifact@v4
        with:
          name: session-state-design

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: services/claims-api/package-lock.json

      - name: Install dependencies
        working-directory: services/claims-api
        run: npm ci

      - name: Install Playwright browsers
        working-directory: services/claims-api
        run: npx playwright install --with-deps chromium

      - name: Run Playwright API tests
        id: run-tests
        working-directory: services/claims-api
        run: npm test
        continue-on-error: true

      - name: Set up Python (for session state write)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Record execution results
        run: |
          EXIT_CODE="${{ steps.run-tests.outcome == 'success' && '0' || '1' }}"
          python tools/agents/session_state.py write \
            --session "${{ needs.orchestrate.outputs.session_id }}" \
            --key test_execution \
            --data "{
              \"service\":\"claims-api\",
              \"runner\":\"playwright\",
              \"exit_code\":$EXIT_CODE,
              \"artefacts\":[
                \"playwright-report-claims-api\",
                \"claims-api-junit\"
              ]
            }"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-claims-api
          path: services/claims-api/playwright-report/

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claims-api-junit
          path: services/claims-api/test-results/

      - name: Upload session state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-state-claims-api
          path: agent-sessions.json
          retention-days: 7

      - name: Fail if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

  # ── 2b. Test Execution Agent – pricing (pytest) ──────────────────────────
  execute-pricing:
    name: "▶️ Execute – pricing (pytest)"
    runs-on: ubuntu-latest
    needs: [orchestrate, test-design]
    if: contains(fromJson(needs.orchestrate.outputs.services_json), 'pricing')

    steps:
      - uses: actions/checkout@v4

      - name: Download session state
        uses: actions/download-artifact@v4
        with:
          name: session-state-design

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: services/pricing
        run: uv pip install -e ".[dev]" --system

      - name: Get quarantine flags
        id: quarantine
        run: |
          FLAGS=$(python tools/ci/quarantine.py deselect --service pricing 2>/dev/null || true)
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        id: run-unit
        working-directory: services/pricing
        run: |
          pytest tests/unit -v --tb=short \
            --junitxml=test-results/unit.xml \
            ${{ steps.quarantine.outputs.flags }}
        continue-on-error: true

      - name: Write session state
        run: |
          EXIT_CODE="${{ steps.run-unit.outcome == 'success' && '0' || '1' }}"
          python tools/agents/session_state.py write \
            --session "${{ needs.orchestrate.outputs.session_id }}" \
            --key test_execution \
            --data "{
              \"service\":\"pricing\",
              \"runner\":\"pytest\",
              \"exit_code\":$EXIT_CODE,
              \"artefacts\":[\"pricing-unit-results\"]
            }"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-unit-results
          path: services/pricing/test-results/

      - name: Upload session state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-state-pricing
          path: agent-sessions.json
          retention-days: 7

      - name: Fail if tests failed
        if: steps.run-unit.outcome == 'failure'
        run: exit 1

  # ── 2c. Test Execution Agent – policy (pytest) ───────────────────────────
  execute-policy:
    name: "▶️ Execute – policy (pytest)"
    runs-on: ubuntu-latest
    needs: [orchestrate, test-design]
    if: contains(fromJson(needs.orchestrate.outputs.services_json), 'policy')

    steps:
      - uses: actions/checkout@v4

      - name: Download session state
        uses: actions/download-artifact@v4
        with:
          name: session-state-design

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: services/policy
        run: uv pip install -e ".[dev]" --system

      - name: Get quarantine flags
        id: quarantine
        run: |
          FLAGS=$(python tools/ci/quarantine.py deselect --service policy 2>/dev/null || true)
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        id: run-unit
        working-directory: services/policy
        run: |
          pytest tests/unit -v --tb=short \
            --junitxml=test-results/unit.xml \
            ${{ steps.quarantine.outputs.flags }}
        continue-on-error: true

      - name: Write session state
        run: |
          EXIT_CODE="${{ steps.run-unit.outcome == 'success' && '0' || '1' }}"
          python tools/agents/session_state.py write \
            --session "${{ needs.orchestrate.outputs.session_id }}" \
            --key test_execution \
            --data "{
              \"service\":\"policy\",
              \"runner\":\"pytest\",
              \"exit_code\":$EXIT_CODE,
              \"artefacts\":[\"policy-unit-results\"]
            }"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-unit-results
          path: services/policy/test-results/

      - name: Upload session state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-state-policy
          path: agent-sessions.json
          retention-days: 7

      - name: Fail if tests failed
        if: steps.run-unit.outcome == 'failure'
        run: exit 1

  # ── 3. Validation & Assertion Agent ──────────────────────────────────────
  validate:
    name: "✅ Validation & Assertion"
    runs-on: ubuntu-latest
    needs:
      - orchestrate
      - execute-claims-api
      - execute-pricing
      - execute-policy
    if: always()

    steps:
      - uses: actions/checkout@v4

      # Download all session states and merge into the latest
      - name: Download session states
        uses: actions/download-artifact@v4
        with:
          pattern: session-state-*
          merge-multiple: true

      - name: Download all test artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results"
          path: /tmp/test-artifacts
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The Validation & Assertion Agent logic: parse JUnit XML and compare
      # against the quality baseline.
      - name: Run PII scan on artefacts
        id: pii-scan
        run: |
          pip install detect-secrets==1.5.0 -q
          python tools/ci/pii_scan.py --path /tmp/test-artifacts 2>/dev/null || true
          echo "pii_status=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Validate results against baseline
        id: validate
        run: |
          python3 - <<'PYEOF'
          import json, sys, xml.etree.ElementTree as ET
          from pathlib import Path

          baseline = {
              "claims-api": {"min_tests": 4},
              "pricing":    {"min_tests": 4},
              "policy":     {"min_tests": 4},
          }

          overall = "passed"
          issues = []

          for xml_file in Path("/tmp/test-artifacts").rglob("*.xml"):
              try:
                  root = ET.parse(xml_file).getroot()
                  suites = root.findall(".//testsuite") or [root]
                  for suite in suites:
                      failures = int(suite.get("failures", 0))
                      errors   = int(suite.get("errors",   0))
                      tests    = int(suite.get("tests",    0))
                      if failures > 0 or errors > 0:
                          overall = "failed"
                          issues.append(f"{xml_file}: {failures} failures, {errors} errors")
                      print(f"  {xml_file.name}: {tests} tests, {failures} failures")
              except Exception as e:
                  issues.append(f"Parse error {xml_file}: {e}")

          result = {"overall": overall, "issues": issues}
          print(json.dumps(result, indent=2))

          with open("validation-result.json", "w") as f:
              json.dump(result, f, indent=2)

          sys.exit(0 if overall == "passed" else 1)
          PYEOF
        continue-on-error: true

      - name: Write validation to session state
        run: |
          RESULT=$(cat validation-result.json 2>/dev/null || echo '{"overall":"unknown","issues":[]}')
          python tools/agents/session_state.py write \
            --session "${{ needs.orchestrate.outputs.session_id }}" \
            --key validation \
            --data "$RESULT"

      - name: Upload session state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-state-validation
          path: agent-sessions.json
          retention-days: 7

      - name: Fail if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1

  # ── 4. Failure Analysis Agent ─────────────────────────────────────────────
  failure-analysis:
    name: "🔍 Failure Analysis"
    runs-on: ubuntu-latest
    needs: [orchestrate, validate]
    if: failure()

    steps:
      - uses: actions/checkout@v4

      - name: Download session state
        uses: actions/download-artifact@v4
        with:
          name: session-state-validation

      - name: Download test artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results"
          path: /tmp/test-artifacts
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The Failure Analysis Agent parses JUnit XML to triage failures.
      - name: Triage failures
        id: triage
        run: |
          python3 - <<'PYEOF'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path

          findings = []

          for xml_file in Path("/tmp/test-artifacts").rglob("*.xml"):
              try:
                  root = ET.parse(xml_file).getroot()
                  for tc in root.iter("testcase"):
                      failure = tc.find("failure") or tc.find("error")
                      if failure is not None:
                          findings.append({
                              "test": f"{tc.get('classname','')}.{tc.get('name','')}",
                              "file": xml_file.name,
                              "message": (failure.get("message") or "")[:300],
                              "category": "code_defect",
                              "recommended_fix": "Inspect source and test file for logic mismatch",
                          })
              except Exception:
                  pass

          report = {
              "failure_analysis": {
                  "findings": findings,
                  "quarantined_tests": [],
                  "regression_risk": "medium" if findings else "low",
                  "recommended_actions": [
                      f"Fix: {f['test']} – {f['message']}" for f in findings
                  ],
              }
          }
          print(json.dumps(report, indent=2))
          with open("failure-analysis.json", "w") as fh:
              json.dump(report, fh, indent=2)
          PYEOF

      - name: Write failure analysis to session state
        run: |
          DATA=$(cat failure-analysis.json)
          python tools/agents/session_state.py write \
            --session "${{ needs.orchestrate.outputs.session_id }}" \
            --key failure_analysis \
            --data "$DATA"

      - name: Upload session state
        uses: actions/upload-artifact@v4
        with:
          name: session-state-failure-analysis
          path: agent-sessions.json
          retention-days: 7

      - name: Upload failure analysis report
        uses: actions/upload-artifact@v4
        with:
          name: failure-analysis-report
          path: failure-analysis.json
          retention-days: 30

  # ── 5. Reporting & Feedback Agent ────────────────────────────────────────
  report:
    name: "📊 Reporting & Feedback"
    runs-on: ubuntu-latest
    needs:
      - orchestrate
      - validate
      - failure-analysis
    if: always()

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download all session states (merge)
        uses: actions/download-artifact@v4
        with:
          pattern: session-state-*
          merge-multiple: true

      - name: Download all test artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results"
          path: /tmp/test-artifacts
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Mark session complete (passed/failed based on validate job outcome)
      - name: Mark session complete
        run: |
          STATUS="passed"
          if [ "${{ needs.validate.result }}" != "success" ]; then
            STATUS="failed"
          fi
          python tools/agents/session_state.py complete \
            --session "${{ needs.orchestrate.outputs.session_id }}" \
            --status "$STATUS"

      # Generate PR or release evidence
      - name: Generate PR evidence
        if: github.event_name == 'pull_request'
        run: |
          python tools/ci/generate_pr_evidence.py \
            --template evidence/templates/pr-evidence.md \
            --artifacts /tmp/test-artifacts \
            --pr   "${{ github.event.pull_request.number }}" \
            --sha  "${{ github.event.pull_request.head.sha }}" \
            --output "evidence/pr/pr-${{ github.event.pull_request.number }}-agent.md"

      - name: Generate release evidence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python tools/ci/generate_release_evidence.py \
            --template evidence/templates/release-evidence.md \
            --artifacts /tmp/test-artifacts \
            --sha    "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --output "evidence/release/agent-nightly-${{ github.run_id }}.md"

      # Emit the structured JSON status consumed by downstream systems
      - name: Emit structured status
        run: |
          STATUS="passed"
          if [ "${{ needs.validate.result }}" != "success" ]; then
            STATUS="failed"
          fi
          EVIDENCE_PATH="evidence/pr/pr-${{ github.event.pull_request.number }}-agent.md"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            EVIDENCE_PATH="evidence/release/agent-nightly-${{ github.run_id }}.md"
          fi
          SESSION_ID="${{ needs.orchestrate.outputs.session_id }}"
          python3 - <<PYEOF
          import json, sys
          from pathlib import Path

          session_file = Path("agent-sessions.json")
          session = {}
          if session_file.exists():
              data = json.loads(session_file.read_text())
              session = data.get("$SESSION_ID", {})

          # Count failures from failure_analysis block
          fa = session.get("blocks", {}).get("failure_analysis", {})
          findings = fa.get("findings", []) if isinstance(fa, dict) else []
          open_issues = len([f for f in findings if isinstance(f, dict)])

          # Count quarantined tests added this session
          quarantined = fa.get("quarantined_tests", []) if isinstance(fa, dict) else []
          new_quarantines = len(quarantined)

          status = {
            "session_id":      "$SESSION_ID",
            "overall_status":  "$STATUS",
            "services_tested": ${{ needs.orchestrate.outputs.services_json }},
            "evidence_path":   "$EVIDENCE_PATH",
            "open_issues":     open_issues,
            "new_quarantines": new_quarantines,
          }
          print(json.dumps(status, indent=2))
          PYEOF

      - name: Commit evidence back to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evidence/ agent-sessions.json
          git diff --cached --quiet || \
            git commit -m "ci(agents): test pipeline evidence – session ${{ needs.orchestrate.outputs.session_id }} [skip ci]"
          git push || true

      - name: Upload release evidence artefact
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: agent-release-evidence-${{ github.run_id }}
          path: evidence/release/agent-nightly-${{ github.run_id }}.md
          retention-days: 90

      - name: Upload final session state
        uses: actions/upload-artifact@v4
        with:
          name: agent-session-final-${{ github.run_id }}
          path: agent-sessions.json
          retention-days: 30
