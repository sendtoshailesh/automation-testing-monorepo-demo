name: Nightly Regression

on:
  schedule:
  #  - cron: "0 2 * * *"   # 02:00 UTC every day
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write

jobs:
  # ── 1. PII scan ────────────────────────────────────────────────────────────
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run PII / secrets scan
        run: python tools/ci/pii_scan.py --path .

  # ── 2. Python unit + integration smoke (pricing) ──────────────────────────
  pricing-full:
    runs-on: ubuntu-latest
    needs: pii-scan
    services:
      pricing-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pricing_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: services/pricing
        run: uv pip install -e ".[dev]" --system

      - name: Run unit tests
        working-directory: services/pricing
        run: pytest tests/unit -v --tb=short --junitxml=test-results/unit.xml

      - name: Run integration smoke tests
        working-directory: services/pricing
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/pricing_test
        run: pytest tests/integration -v --tb=short --junitxml=test-results/integration.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pricing-results
          path: services/pricing/test-results/

  # ── 3. Python unit + integration smoke (policy) ───────────────────────────
  policy-full:
    runs-on: ubuntu-latest
    needs: pii-scan
    services:
      policy-db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: policy_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: services/policy
        run: uv pip install -e ".[dev]" --system

      - name: Run unit tests
        working-directory: services/policy
        run: pytest tests/unit -v --tb=short --junitxml=test-results/unit.xml

      - name: Run integration smoke tests
        working-directory: services/policy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/policy_test
        run: pytest tests/integration -v --tb=short --junitxml=test-results/integration.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-policy-results
          path: services/policy/test-results/

  # ── 4. claims-api Playwright API tests ────────────────────────────────────
  claims-api-full:
    runs-on: ubuntu-latest
    needs: pii-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/claims-api/package-lock.json

      - name: Install dependencies
        working-directory: services/claims-api
        run: npm ci

      - name: Install Playwright browsers
        working-directory: services/claims-api
        run: npx playwright install --with-deps chromium

      - name: Run Playwright API tests
        working-directory: services/claims-api
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report-claims-api
          path: services/claims-api/playwright-report/

  # ── 5. ui-portal Selenium tests (self-hosted) ─────────────────────────────
  ui-portal-full:
    runs-on: self-hosted
    needs: pii-scan
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: services/ui-portal
        run: uv pip install -e ".[dev]" --system

      - name: Run Selenium tests
        working-directory: services/ui-portal
        run: pytest tests/ -v --tb=short --junitxml=test-results/selenium.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-selenium-results
          path: services/ui-portal/test-results/

  # ── 6. Generate release evidence ──────────────────────────────────────────
  release-evidence:
    runs-on: ubuntu-latest
    needs:
      - pricing-full
      - policy-full
      - claims-api-full
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all test artefacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/test-artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate release evidence
        run: |
          python tools/ci/generate_release_evidence.py \
            --template evidence/templates/release-evidence.md \
            --artifacts /tmp/test-artifacts \
            --sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --output "evidence/release/nightly-${{ github.run_id }}.md"

      - name: Upload release evidence artefact
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.run_id }}
          path: evidence/release/nightly-${{ github.run_id }}.md
          retention-days: 90
