[project]
name = "ui-portal"
version = "0.1.0"
description = "UI Portal Selenium tests"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "selenium>=4.20",
    "webdriver-manager>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
